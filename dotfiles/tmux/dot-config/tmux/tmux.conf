set -g mouse on
set -s set-clipboard external
set -g default-terminal "${TERM}"
set -g cursor-style bar
set-option -g history-limit 10000
set-option -g destroy-unattached on
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g focus-events on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
bind ы source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

set-window-option -g mode-keys vi
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1

# Reuse the lowest available automatic session name.
set-hook -g session-created 'run-shell "~/.config/tmux/scripts/reuse-numeric-session-name.sh #{q:hook_session}"'

bind | split-window -hc "#{pane_current_path}"
bind - split-window -vc "#{pane_current_path}"
bind g display-popup -E -d "#{pane_current_path}" -w 85% -h 85% lazygit
bind е display-popup -E -d "#{pane_current_path}" -w 85% -h 85% lazygit

bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Refresh WM/session variables from the attaching client.
set -ag update-environment WAYLAND_DISPLAY
set -ag update-environment DISPLAY
set -ag update-environment XDG_RUNTIME_DIR
set -ag update-environment DBUS_SESSION_BUS_ADDRESS
set -ag update-environment MANGO_INSTANCE_SIGNATURE
set -ag update-environment XDG_CURRENT_DESKTOP
set -ag update-environment DESKTOP_SESSION
set -ag update-environment XDG_SESSION_TYPE
set -ag update-environment SSH_AUTH_SOCK
bind E switch-client -t : \; display-message "Environment updated!"
bind л switch-client -t : \; display-message "Environment updated!"

# Russian layout aliases for built-in pane actions.
bind я resize-pane -Z
bind ъ paste-buffer

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin '2kabhishek/tmux2k'

set -g @tmux2k-left-plugins "session cwd"
set -g @tmux2k-window-list-alignment "absolute-centre"
set -g @tmux2k-right-plugins "git"

source-file ~/.config/tmux/colors.conf
run '~/.config/tmux/plugins/tpm/tpm'
