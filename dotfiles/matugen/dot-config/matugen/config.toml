[config]

[templates.waybar]
input_path = './templates/colors.css'
output_path ='~/.config/waybar/generated/colors.css'
post_hook = 'pkill -SIGUSR2 waybar || true'

[templates.btop]
input_path = './templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = 'pkill -USR2 btop || true'

[templates.gtk3]
input_path = './templates/gtk.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-{{mode}}'

[templates.gtk4]
input_path = './templates/gtk.css'
output_path = '~/.config/gtk-4.0/colors.css'
post_hook = 'sh ~/.config/matugen/scripts/gtk-themes-reload.sh'

[templates.mango]
input_path = './templates/mango.conf'
output_path = '~/.config/mango/conf.d/generated-colors.conf'
post_hook = 'mmsg dispatch reload_config && sleep 0.2 && mmsg dispatch reload_config && sleep 0.3 && mmsg dispatch reload_config'

[templates.qt5ct]
input_path = './templates/qtct.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = './templates/qtct.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.kvantum_kvconfig]
input_path = './templates/kvantum.kvconfig'
output_path = '~/.config/Kvantum/matugen/matugen.kvconfig'

[templates.kvantum_svg]
input_path = './templates/kvantum.svg'
output_path = '~/.config/Kvantum/matugen/matugen.svg'

[templates.pywalfox]
input_path = './templates/pywalfox.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'pywalfox update'

[templates.obs]
input_path = './templates/obs.obt'
output_path = '~/.config/obs-studio/themes/matugen.obt'

[templates.fish]
input_path = './templates/fish.fish'
output_path = '~/.config/fish/conf.d/000_colors.fish'

[templates.terminal]
input_path = './templates/terminal.sh'
output_path = '~/.config/term-colors.sh'

[templates.foot]
input_path = './templates/foot.ini'
output_path = '~/.config/foot/matugen.ini'

[templates.old-terminals]
input_path = './templates/old-terminals.sh'
output_path = '~/.cache/old-terminals.sh'
post_hook = 'sh ~/.cache/old-terminals.sh'

[templates.opencode]
input_path = './templates/opencode.json'
output_path = '~/.config/opencode/themes/matugen.json'

[templates.heroic]
input_path = './templates/heroic.css'
output_path = '~/.local/share/guix-sandbox-home/.config/heroic/css/matugen.css'

[templates.ayugram_background]
pre_hook = 'mkdir -p ~/.local/share/AyuGramDesktop/matugen'
input_path = './templates/telegram-background-solid.svg'
output_path = '~/.local/share/AyuGramDesktop/matugen/background.svg'
post_hook = 'convert ~/.local/share/AyuGramDesktop/matugen/background.svg ~/.local/share/AyuGramDesktop/matugen/background.jpg'
index = 0

[templates.ayugram]
input_path = './templates/telegram.tdesktop-theme'
output_path = '~/.local/share/AyuGramDesktop/matugen/colors.tdesktop-theme'
post_hook = 'zip -qj - ~/.local/share/AyuGramDesktop/matugen/colors.tdesktop-theme ~/.local/share/AyuGramDesktop/matugen/background.jpg >~/.local/share/AyuGramDesktop/matugen.tdesktop-theme'
index = 1

[templates.tmux]
input_path = './templates/tmux-colors.conf'
output_path = '~/.config/tmux/colors.conf'
post_hook = 'tmux source-file ~/.config/tmux/colors.conf'

[templates.nvim]
input_path = './templates/nvim-colors.vim'
output_path = '~/.config/nvim/colors/matugen.vim'
post_hook = 'pkill -SIGUSR1 nvim || true'

[templates.equibop-system24]
input_path = './templates/discord-system24.css'
output_path = '~/.config/equibop/themes/system24.css'

[templates.equibop-midnight]
input_path = './templates/discord-midnight.css'
output_path = '~/.config/equibop/themes/midnight.css'

[templates.rofi]
input_path = './templates/rofi-colors.rasi'
output_path = '~/.config/rofi/colors.rasi'

[templates.steam]
input_path = './templates/steam.css'
output_path = '~/.cache/adwaita-for-steam/custom.css'
post_hook = 'adwaita-for-steam --custom-css ~/.cache/adwaita-for-steam/custom.css --font system --target ~/.local/share/guix-sandbox-home/.local/share/Steam/'
